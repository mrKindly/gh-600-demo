name: Evals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run 12 behavior checks
        run: node evals/run.js "origin/${{ github.base_ref || 'main' }}"
